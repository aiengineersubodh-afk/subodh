<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Analytics Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070F1B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let t = 0;

    function init(w, h) {}
    function onResize(w, h) {}

    function update(dt) {
      t += dt * 1.5;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);

      // Circular KPI Progress Gauges
      function drawGauge(gx, gy, val, color) {
        ctx.beginPath();
        ctx.arc(gx, gy, 32, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(gx, gy, 32, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * val);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      drawGauge(w * 0.28, h * 0.42, 0.78 + Math.sin(t) * 0.05, "#3B82F6");
      drawGauge(w * 0.72, h * 0.42, 0.64 + Math.cos(t) * 0.08, "#10B981");

      // Area Trend forecast chart at bottom
      ctx.beginPath();
      ctx.moveTo(w * 0.1, h * 0.85);
      for (let x = 0; x < w * 0.8; x += 15) {
        const curY = h * 0.78 - Math.sin(x * 0.02 + t) * 18 - (x * 0.05);
        ctx.lineTo(w * 0.1 + x, curY);
      }
      ctx.lineTo(w * 0.9, h * 0.85);
      ctx.closePath();
      ctx.fillStyle = "rgba(59, 130, 246, 0.18)";
      ctx.fill();
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
