<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d3cd2f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      const candles = [];
      let tickT = 0;

      function init(w, h) {
        candles.length = 0;
        const count = 22;
        const cW = (w * 0.8) / count;
        let price = h * 0.5;

        for (let i = 0; i < count; i++) {
          const change = (Math.random() - 0.48) * 35;
          const open = price;
          const close = price + change;
          const high = Math.min(open, close) - Math.random() * 15;
          const low = Math.max(open, close) + Math.random() * 15;
          candles.push({ x: w * 0.1 + i * cW, w: cW * 0.65, open, close, high, low, isBull: close < open });
          price = close;
        }
      }

      function onResize(w, h) { init(w, h); }

      function update(dt) {
        tickT += dt;
        if (tickT > 1.2) {
          tickT = 0;
          // Shift candles left and add new
          candles.shift();
          const last = candles[candles.length - 1];
          const cW = candles[0].w / 0.65;
          const change = (Math.random() - 0.48) * 30;
          const open = last.close;
          const close = open + change;
          const high = Math.min(open, close) - Math.random() * 15;
          const low = Math.max(open, close) + Math.random() * 15;
          candles.push({ x: last.x + cW, w: last.w, open, close, high, low, isBull: close < open });
          for (let i = 0; i < candles.length; i++) candles[i].x = w * 0.1 + i * cW;
        }
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);

        // Financial Candlesticks
        for (const c of candles) {
          ctx.strokeStyle = c.isBull ? "#22C55E" : "#EF4444";
          ctx.fillStyle = c.isBull ? "#22C55E" : "#EF4444";
          ctx.lineWidth = 1.2;

          // Wick
          ctx.beginPath();
          ctx.moveTo(c.x + c.w * 0.5, c.high);
          ctx.lineTo(c.x + c.w * 0.5, c.low);
          ctx.stroke();

          // Real Body
          const top = Math.min(c.open, c.close);
          const bH = Math.max(4, Math.abs(c.open - c.close));
          ctx.fillRect(c.x, top, c.w, bH);
        }

        // Moving Average line (EMA)
        ctx.beginPath();
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.8;
        for (let i = 0; i < candles.length; i++) {
          const c = candles[i];
          const y = (c.open + c.close) * 0.5;
          if (i === 0) ctx.moveTo(c.x + c.w * 0.5, y); else ctx.lineTo(c.x + c.w * 0.5, y);
        }
        ctx.stroke();
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
