<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern History and Archives Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #120D09; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let scanY = 0;

    function init(w, h) { scanY = h * 0.2; }
    function onResize(w, h) { scanY = h * 0.2; }

    function update(dt) {
      scanY += dt * 45;
      if (scanY > h * 0.8) scanY = h * 0.2;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);

      // Archival Parchment Sheet Outline
      ctx.strokeStyle = "rgba(217, 119, 6, 0.3)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(w * 0.2, h * 0.15, w * 0.6, h * 0.7);

      // Historical milestone timeline axis in center
      const midY = h * 0.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.25, midY);
      ctx.lineTo(w * 0.75, midY);
      ctx.strokeStyle = "#D97706";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Milestone epoch nodes
      for (let i = 0; i < 5; i++) {
        const mx = w * 0.28 + i * (w * 0.11);
        ctx.beginPath();
        ctx.arc(mx, midY, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#FBBF24";
        ctx.fill();
      }

      // Archival preservation scanner laser sweep line
      ctx.beginPath();
      ctx.moveTo(w * 0.2, scanY);
      ctx.lineTo(w * 0.8, scanY);
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 1.8;
      ctx.shadowColor = "#38BDF8";
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
