<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern History and Archives Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5F0E6;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let w, h, dpr;
      let time = 0;
      let paused = false;
      let lastTime = performance.now();

      const reducedMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const colors = {
        brown: "#9A6537",
        gold: "#C28A36",
        amber: "#D97706",
        blue: "#0E7490",
        cream: "#FFF9ED",
        dark: "#704B2A"
      };

      let particles = [];
      let milestones = [];
      let documentParticles = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;

        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        init();
        draw();
      }

      function init() {
        particles = [];
        milestones = [];
        documentParticles = [];

        const cx = w / 2;
        const cy = h / 2;
        const spacing = Math.min(w * 0.115, 100);

        for (let i = 0; i < 5; i++) {
          milestones.push({
            x: cx + (i - 2) * spacing,
            y: cy + (i % 2 === 0 ? -5 : 5),
            phase: Math.random() * Math.PI * 2,
            size: 7 + Math.random() * 2
          });
        }

        for (let i = 0; i < 100; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 2 + 0.4,
            speed: Math.random() * 0.35 + 0.08,
            alpha: Math.random() * 0.35 + 0.08,
            drift: Math.random() * 0.3 - 0.15
          });
        }

        for (let i = 0; i < 8; i++) {
          documentParticles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            angle: Math.random() * 0.3 - 0.15,
            scale: 0.65 + Math.random() * 0.35,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawBackground() {
        ctx.fillStyle = "#F5F0E6";
        ctx.fillRect(0, 0, w, h);

        const gradient = ctx.createRadialGradient(
          w * 0.5, h * 0.5, 20,
          w * 0.5, h * 0.5, Math.max(w, h) * 0.65
        );

        gradient.addColorStop(0, "rgba(217,180,125,0.18)");
        gradient.addColorStop(0.6, "rgba(245,240,230,0.08)");
        gradient.addColorStop(1, "rgba(245,240,230,0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle paper texture
        ctx.fillStyle = "rgba(154,101,55,0.06)";

        for (let x = 15; x < w; x += 38) {
          for (let y = 15; y < h; y += 38) {
            ctx.beginPath();
            ctx.arc(x, y, 0.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawParticles(dt) {
        particles.forEach(p => {
          p.y -= p.speed * dt * 60;
          p.x += p.drift * dt * 20;

          if (p.y < -5) {
            p.y = h + 5;
            p.x = Math.random() * w;
          }

          if (p.x < -5) p.x = w + 5;
          if (p.x > w + 5) p.x = -5;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(154,101,55,${p.alpha})`;
          ctx.fill();
        });
      }

      function drawArchiveFrame(cx, cy) {
        const width = Math.min(w * 0.66, 760);
        const height = Math.min(h * 0.65, 440);
        const x = cx - width / 2;
        const y = cy - height / 2;

        // Outer archival frame
        ctx.strokeStyle = "rgba(154,101,55,0.24)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, width, height);

        // Inner frame
        ctx.strokeStyle = "rgba(194,138,54,0.22)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 13, y + 13, width - 26, height - 26);

        // Corner details
        const corners = [
          [x, y], [x + width, y],
          [x, y + height], [x + width, y + height]
        ];

        corners.forEach(([px, py]) => {
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fillStyle = colors.gold;
          ctx.fill();
        });
      }

      function drawDocument(x, y, angle, scale, phase) {
        ctx.save();
        ctx.translate(x, y + Math.sin(time * 0.001 + phase) * 7);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        // Paper shadow
        ctx.shadowColor = "rgba(112,75,42,0.15)";
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 5;

        ctx.fillStyle = "#FFF9ED";
        ctx.fillRect(-34, -46, 68, 92);

        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // Paper border
        ctx.strokeStyle = "rgba(154,101,55,0.4)";
        ctx.lineWidth = 1;
        ctx.strokeRect(-34, -46, 68, 92);

        // Decorative document lines (no text)
        for (let i = 0; i < 7; i++) {
          const lineWidth = i === 0 ? 35 : 42 - (i % 3) * 7;

          ctx.beginPath();
          ctx.moveTo(-21, -28 + i * 10);
          ctx.lineTo(-21 + lineWidth, -28 + i * 10);
          ctx.strokeStyle = "rgba(154,101,55,0.3)";
          ctx.lineWidth = i === 0 ? 2 : 1;
          ctx.stroke();
        }

        // Archive seal
        ctx.beginPath();
        ctx.arc(15, 27, 8, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(217,119,6,0.22)";
        ctx.fill();
        ctx.strokeStyle = colors.gold;
        ctx.stroke();

        ctx.restore();
      }

      function drawFloatingDocuments() {
        documentParticles.forEach(doc => {
          drawDocument(
            doc.x,
            doc.y,
            doc.angle,
            doc.scale,
            doc.phase
          );
        });
      }

      function drawTimeline(cx, cy) {
        const spacing = Math.min(w * 0.115, 100);

        // Main timeline
        ctx.beginPath();
        ctx.moveTo(cx - spacing * 2.35, cy);
        ctx.lineTo(cx + spacing * 2.35, cy);

        ctx.strokeStyle = "rgba(154,101,55,0.35)";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Secondary timeline glow
        ctx.beginPath();
        ctx.moveTo(cx - spacing * 2.35, cy);
        ctx.lineTo(cx + spacing * 2.35, cy);

        ctx.strokeStyle = "rgba(217,119,6,0.15)";
        ctx.lineWidth = 9;
        ctx.stroke();

        // Historical milestone nodes
        milestones.forEach((m, i) => {
          const pulse = Math.sin(time * 0.002 + m.phase) * 2;
          const r = m.size + pulse;

          ctx.beginPath();
          ctx.arc(m.x, m.y, r + 12, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(194,138,54,0.12)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
          ctx.fillStyle = colors.gold;
          ctx.shadowColor = colors.gold;
          ctx.shadowBlur = 16;
          ctx.fill();

          ctx.shadowBlur = 0;

          ctx.beginPath();
          ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = "#FFF9ED";
          ctx.fill();
        });

        // Timeline connection markers
        for (let i = 0; i < 4; i++) {
          const x = cx - spacing * 2 + i * spacing;
          const y = cy;

          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fillStyle = colors.dark;
          ctx.fill();
        }
      }

      function drawHistoricalArtifacts(cx, cy) {
        // Left circular artifact
        ctx.save();
        ctx.translate(cx - Math.min(w * 0.29, 260), cy);

        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(194,138,54,0.09)";
        ctx.fill();

        ctx.strokeStyle = "rgba(154,101,55,0.45)";
        ctx.lineWidth = 2;
        ctx.stroke();

        for (let i = 0; i < 12; i++) {
          const a = i * Math.PI / 6;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
          ctx.lineTo(Math.cos(a) * 41, Math.sin(a) * 41);
          ctx.strokeStyle = colors.gold;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.strokeStyle = colors.amber;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();

        // Right archival seal
        ctx.save();
        ctx.translate(cx + Math.min(w * 0.29, 260), cy);

        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(14,116,144,0.07)";
        ctx.fill();

        ctx.strokeStyle = "rgba(14,116,144,0.45)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.strokeStyle = colors.blue;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(15, 0);
        ctx.moveTo(0, -15);
        ctx.lineTo(0, 15);
        ctx.strokeStyle = colors.blue;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      function drawScanner() {
        const top = h * 0.2;
        const bottom = h * 0.8;
        const scanY = top + ((time * 0.045) % (bottom - top));

        // Scanner beam
        const gradient = ctx.createLinearGradient(
          0, scanY - 16, 0, scanY + 16
        );

        gradient.addColorStop(0, "rgba(14,116,144,0)");
        gradient.addColorStop(0.5, "rgba(14,116,144,0.12)");
        gradient.addColorStop(1, "rgba(14,116,144,0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(w * 0.18, scanY - 16, w * 0.64, 32);

        // Scanner line
        ctx.beginPath();
        ctx.moveTo(w * 0.18, scanY);
        ctx.lineTo(w * 0.82, scanY);

        ctx.strokeStyle = "#0E7490";
        ctx.lineWidth = 1.6;
        ctx.shadowColor = "#0E7490";
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.shadowBlur = 0;

        // Scanner endpoints
        [w * 0.18, w * 0.82].forEach(x => {
          ctx.beginPath();
          ctx.arc(x, scanY, 3, 0, Math.PI * 2);
          ctx.fillStyle = "#0E7490";
          ctx.fill();
        });
      }

      function drawArchiveParticles() {
        for (let i = 0; i < 12; i++) {
          const angle = time * 0.00025 + i * Math.PI / 6;
          const radius = 95 + Math.sin(time * 0.001 + i) * 12;

          const x = w / 2 + Math.cos(angle) * radius;
          const y = h / 2 + Math.sin(angle) * radius * 0.7;

          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = i % 2 === 0
            ? colors.gold
            : colors.blue;

          ctx.globalAlpha = 0.6;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function draw() {
        drawBackground();

        const cx = w / 2;
        const cy = h / 2;

        drawArchiveFrame(cx, cy);
        drawParticles(1);
        drawFloatingDocuments();
        drawHistoricalArtifacts(cx, cy);
        drawTimeline(cx, cy);
        drawArchiveParticles();
        drawScanner();
      }

      function animate(now) {
        if (paused) return;

        const dt = Math.min(
          (now - lastTime) / 1000,
          0.05
        );

        lastTime = now;
        time += dt * 1000;

        draw();

        if (!reducedMotion) {
          requestAnimationFrame(animate);
        }
      }

      function start() {
        if (paused) return;

        lastTime = performance.now();

        if (!reducedMotion) {
          requestAnimationFrame(animate);
        } else {
          draw();
        }
      }

      window.addEventListener("message", e => {
        if (e.data === "pause") {
          paused = true;
        }

        if (e.data === "play" && paused) {
          paused = false;
          start();
        }
      });

      document.addEventListener("visibilitychange", () => {
        paused = document.hidden;

        if (!paused) {
          start();
        }
      });

      window.addEventListener("resize", resize);

      resize();
      start();
    })();
  </script>
</body>

</html>
