<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sociology and Development Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B101D; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    const clusters = [];

    function init(w, h) {
      clusters.length = 0;
      // 3 Community Clusters
      const centers = [
        { cx: w * 0.3, cy: h * 0.4, color: "#F59E0B" },
        { cx: w * 0.7, cy: h * 0.45, color: "#0EA5E9" },
        { cx: w * 0.5, cy: h * 0.72, color: "#F43F5E" }
      ];

      for (const c of centers) {
        const nodes = [];
        for (let i = 0; i < 7; i++) {
          nodes.push({
            x: c.cx + (Math.random() - 0.5) * 60,
            y: c.cy + (Math.random() - 0.5) * 50,
            color: c.color
          });
        }
        clusters.push(nodes);
      }
    }

    function onResize(w, h) { init(w, h); }
    function update(dt) {}

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);

      // Intra-community social ties
      ctx.lineWidth = 1;
      for (const group of clusters) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        for (let i = 0; i < group.length; i++) {
          for (let j = i + 1; j < group.length; j++) {
            ctx.beginPath();
            ctx.moveTo(group[i].x, group[i].y);
            ctx.lineTo(group[j].x, group[j].y);
            ctx.stroke();
          }
        }
      }

      // Bridging social capital ties between communities
      ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(clusters[0][0].x, clusters[0][0].y);
      ctx.lineTo(clusters[1][0].x, clusters[1][0].y);
      ctx.lineTo(clusters[2][0].x, clusters[2][0].y);
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);

      // Individuals / Sociometric nodes
      for (const group of clusters) {
        for (const n of group) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = n.color;
          ctx.fill();
        }
      }
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
