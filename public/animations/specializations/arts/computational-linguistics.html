<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computational Linguistics Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07111F; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    const tree = [];

    function init(w, h) {
      tree.length = 0;
      // Syntactic Dependency Parse Tree (S -> NP, VP)
      tree.push({ tag: "S", x: w * 0.5, y: h * 0.25 });
      tree.push({ tag: "NP", x: w * 0.32, y: h * 0.5, p: 0 });
      tree.push({ tag: "VP", x: w * 0.68, y: h * 0.5, p: 0 });
      tree.push({ tag: "Det", x: w * 0.22, y: h * 0.75, p: 1 });
      tree.push({ tag: "Noun", x: w * 0.42, y: h * 0.75, p: 1 });
      tree.push({ tag: "Verb", x: w * 0.6, y: h * 0.75, p: 2 });
      tree.push({ tag: "NP", x: w * 0.78, y: h * 0.75, p: 2 });
    }

    function onResize(w, h) { init(w, h); }
    function update(dt) {}

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);

      // Syntax tree branches
      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 1.5;
      for (let i = 1; i < tree.length; i++) {
        const n = tree[i];
        const p = tree[n.p];
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(n.x, n.y);
        ctx.stroke();
      }

      // Syntax nodes
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const n of tree) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = "#0F1E36";
        ctx.fill();
        ctx.strokeStyle = "#06B6D4";
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(n.tag, n.x, n.y);
      }
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
