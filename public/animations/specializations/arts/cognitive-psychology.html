<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Psychology Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5F3FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let w, h, dpr;
      let t = 0;
      let paused = false;
      let lastTime = performance.now();

      const reducedMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const purple = "#8B5CF6";
      const cyan = "#0891B2";
      const amber = "#F59E0B";

      let particles = [];
      let neuralNodes = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;

        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        init();
        draw();
      }

      function init() {
        particles = [];
        neuralNodes = [];

        for (let i = 0; i < 85; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2 + 0.6,
            speed: Math.random() * 0.5 + 0.15,
            alpha: Math.random() * 0.4 + 0.15
          });
        }

        for (let i = 0; i < 34; i++) {
          neuralNodes.push({
            angle: Math.random() * Math.PI * 2,
            radius: Math.random() * 95 + 40,
            phase: Math.random() * Math.PI * 2,
            side: Math.random() > 0.5 ? -1 : 1
          });
        }
      }

      function background() {
        ctx.fillStyle = "#F5F3FF";
        ctx.fillRect(0, 0, w, h);

        const gradient = ctx.createRadialGradient(
          w / 2, h / 2, 20,
          w / 2, h / 2, Math.max(w, h) * 0.55
        );

        gradient.addColorStop(0, "rgba(221,214,254,0.30)");
        gradient.addColorStop(1, "rgba(245,243,255,0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "rgba(139,92,246,0.10)";

        for (let x = 15; x < w; x += 34) {
          for (let y = 15; y < h; y += 34) {
            ctx.beginPath();
            ctx.arc(x, y, 1, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawParticles() {
        particles.forEach(p => {
          p.y -= p.speed;

          if (p.y < -5) {
            p.y = h + 5;
            p.x = Math.random() * w;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(139,92,246,${p.alpha})`;
          ctx.fill();
        });
      }

      function drawBrain(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // Soft brain glow
        const glow = ctx.createRadialGradient(
          0, 0, 20, 0, 0, 120
        );

        glow.addColorStop(0, "rgba(139,92,246,0.16)");
        glow.addColorStop(1, "rgba(139,92,246,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 120, 0, Math.PI * 2);
        ctx.fill();

        // Left hemisphere
        ctx.beginPath();
        ctx.moveTo(-4, -65);
        ctx.bezierCurveTo(-45, -105, -100, -65, -91, -15);
        ctx.bezierCurveTo(-112, 35, -68, 80, -5, 65);
        ctx.closePath();

        ctx.fillStyle = "rgba(139,92,246,0.13)";
        ctx.fill();

        ctx.strokeStyle = purple;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Right hemisphere
        ctx.beginPath();
        ctx.moveTo(4, -65);
        ctx.bezierCurveTo(45, -105, 100, -65, 91, -15);
        ctx.bezierCurveTo(112, 35, 68, 80, 5, 65);
        ctx.closePath();

        ctx.fillStyle = "rgba(8,145,178,0.13)";
        ctx.fill();

        ctx.strokeStyle = cyan;
        ctx.stroke();

        // Brain folds
        for (let i = 0; i < 5; i++) {
          const y = -42 + i * 20;

          ctx.beginPath();
          ctx.moveTo(-12, y);
          ctx.bezierCurveTo(
            -55, y - 25,
            -75, y + 18,
            -42, y + 24
          );

          ctx.strokeStyle = "rgba(139,92,246,0.48)";
          ctx.lineWidth = 1.6;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(12, y);
          ctx.bezierCurveTo(
            55, y - 25,
            75, y + 18,
            42, y + 24
          );

          ctx.strokeStyle = "rgba(8,145,178,0.48)";
          ctx.stroke();
        }

        // Central connection
        ctx.beginPath();
        ctx.moveTo(0, -62);
        ctx.lineTo(0, 62);
        ctx.strokeStyle = amber;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }

      function drawNeuralNetwork(cx, cy) {
        const points = [];

        neuralNodes.forEach(n => {
          const angle = n.angle + t * 0.00012 * n.side;

          const radius =
            n.radius + Math.sin(t * 0.002 + n.phase) * 7;

          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius * 0.72;

          points.push({
            x,
            y,
            side: n.side
          });
        });

        // Connect nearby neural nodes
        points.forEach((p, i) => {
          points.forEach((q, j) => {
            if (j <= i) return;

            const dx = p.x - q.x;
            const dy = p.y - q.y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 65 && p.side === q.side) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);

              ctx.strokeStyle = p.side < 0
                ? "rgba(139,92,246,0.20)"
                : "rgba(8,145,178,0.20)";

              ctx.lineWidth = 1;
              ctx.stroke();
            }
          });
        });

        // Neural nodes
        points.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);

          ctx.fillStyle = p.side < 0 ? purple : cyan;
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 8;
          ctx.fill();

          ctx.shadowBlur = 0;
        });
      }

      function drawImpulses(cx, cy) {
        for (let i = 0; i < 5; i++) {
          const progress = (t * 0.0005 + i * 0.2) % 1;

          const x = cx - 38 + progress * 76;
          const y = cy + Math.sin(
            progress * Math.PI * 2 + i
          ) * 4;

          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);

          ctx.fillStyle = amber;
          ctx.shadowColor = amber;
          ctx.shadowBlur = 14;
          ctx.fill();

          ctx.shadowBlur = 0;
        }
      }

      function draw() {
        background();

        const cx = w / 2;
        const cy = h * 0.47;

        drawParticles();
        drawNeuralNetwork(cx, cy);
        drawBrain(
          cx,
          cy,
          Math.min(1, w / 650, h / 470)
        );
        drawImpulses(cx, cy);
      }

      function animate(now) {
        if (paused) return;

        const dt = Math.min(
          (now - lastTime) / 1000,
          0.05
        );

        lastTime = now;
        t += dt * 1000;

        draw();

        if (!reducedMotion) {
          requestAnimationFrame(animate);
        }
      }

      function start() {
        if (paused) return;

        lastTime = performance.now();

        if (!reducedMotion) {
          requestAnimationFrame(animate);
        } else {
          draw();
        }
      }

      // Pause and play support
      window.addEventListener("message", e => {
        if (e.data === "pause") {
          paused = true;
        }

        if (e.data === "play" && paused) {
          paused = false;
          start();
        }
      });

      // Pause animation when tab is hidden
      document.addEventListener("visibilitychange", () => {
        paused = document.hidden;

        if (!paused) {
          start();
        }
      });

      window.addEventListener("resize", resize);

      resize();
      start();
    })();
  </script>
</body>

</html>
