<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision Agronomy Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #de9bd3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      let droneX = 0;

      function init(w, h) { droneX = w * 0.1; }
      function onResize(w, h) { droneX = w * 0.1; }

      function update(dt) {
        droneX += dt * 55;
        if (droneX > w * 0.9) droneX = w * 0.1;
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);

        // Multispectral NDVI Field Grid (False-color crop canopy)
        const rows = 5;
        const cols = 8;
        const cellW = (w * 0.8) / cols;
        const cellH = (h * 0.45) / rows;
        const startX = w * 0.1;
        const startY = h * 0.35;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = Math.sin(r * 0.8 + c * 0.5) * 0.5 + 0.5;
            ctx.fillStyle = val > 0.5 ? "rgba(34, 197, 94, " + (0.2 + val * 0.3) + ")" : "rgba(234, 88, 12, " + (0.2 + (1 - val) * 0.3) + ")";
            ctx.fillRect(startX + c * cellW, startY + r * cellH, cellW - 2, cellH - 2);
          }
        }

        // Autonomous survey drone flight path line
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(startX, startY - 25);
        ctx.lineTo(w * 0.9, startY - 25);
        ctx.stroke();
        ctx.setLineDash([]);

        // Drone icon & sensor scanning cone
        ctx.beginPath();
        ctx.arc(droneX, startY - 25, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#38BDF8";
        ctx.fill();

        // Optical sensor cone
        ctx.beginPath();
        ctx.moveTo(droneX, startY - 25);
        ctx.lineTo(droneX - 25, startY + 30);
        ctx.lineTo(droneX + 25, startY + 30);
        ctx.closePath();
        ctx.fillStyle = "rgba(56, 189, 248, 0.15)";
        ctx.fill();
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
