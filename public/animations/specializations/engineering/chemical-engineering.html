<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemical Engineering Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d3cf50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      const molecules = [];
      let vortexAngle = 0;

      function init(w, h) {
        molecules.length = 0;
        for (let i = 0; i < 35; i++) {
          molecules.push({
            x: w * 0.5 + (Math.random() - 0.5) * (w * 0.5),
            y: h * 0.45 + (Math.random() - 0.5) * (h * 0.4),
            vx: (Math.random() - 0.5) * 30,
            vy: (Math.random() - 0.5) * 30,
            type: Math.random() > 0.5 ? 'A' : 'B'
          });
        }
      }

      function onResize(w, h) { init(w, h); }

      function update(dt) {
        vortexAngle += dt * 2.0;
        for (const m of molecules) {
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          if (m.x < w * 0.2 || m.x > w * 0.8) m.vx *= -1;
          if (m.y < h * 0.25 || m.y > h * 0.75) m.vy *= -1;
        }
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);
        const cx = w * 0.5;
        const cy = h * 0.5;

        // Reactor vessel outline
        ctx.beginPath();
        ctx.rect(w * 0.2, h * 0.25, w * 0.6, h * 0.5);
        ctx.strokeStyle = "rgba(16, 185, 129, 0.35)";
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Fluid level wave inside reactor
        ctx.beginPath();
        ctx.fillStyle = "rgba(6, 182, 212, 0.1)";
        ctx.moveTo(w * 0.2, h * 0.75);
        for (let x = w * 0.2; x <= w * 0.8; x += 10) {
          const y = h * 0.35 + Math.sin(x * 0.03 + vortexAngle) * 6;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w * 0.8, h * 0.75);
        ctx.closePath();
        ctx.fill();

        // Center Impeller agitator shaft & blades
        ctx.beginPath();
        ctx.moveTo(cx, h * 0.15);
        ctx.lineTo(cx, h * 0.65);
        ctx.strokeStyle = "#94A3B8";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Impeller blades
        const bladeW = Math.cos(vortexAngle) * 35;
        ctx.beginPath();
        ctx.moveTo(cx - bladeW, h * 0.65);
        ctx.lineTo(cx + bladeW, h * 0.65);
        ctx.strokeStyle = "#10B981";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Reactant molecules (Catalytic reaction: Green A + Teal B)
        for (const m of molecules) {
          ctx.beginPath();
          ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = m.type === 'A' ? "#10B981" : "#06B6D4";
          ctx.fill();
        }
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
