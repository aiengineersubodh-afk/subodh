<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B080F; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let radarAngle = 0;
    const packets = [];
    const hashes = ['7F83B165', 'E3B0C442', '9F86D081', 'A591A6D4', '046B6C7F'];

    function init(w, h) {
      packets.length = 0;
      for (let i = 0; i < 20; i++) {
        packets.push({
          x: Math.random() * w,
          y: Math.random() * h,
          speed: 40 + Math.random() * 60,
          blocked: Math.random() > 0.5
        });
      }
    }

    function onResize(w, h) { init(w, h); }

    function update(dt) {
      radarAngle += dt * 1.6;
      for (const p of packets) {
        p.x -= p.speed * dt;
        if (p.x < 0) {
          p.x = w + 20;
          p.y = Math.random() * h;
        }
      }
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5;
      const cy = h * 0.48;

      // Hexagonal Shield in Center
      function drawHex(radius, strokeStyle, width) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i - Math.PI / 6;
          const x = cx + radius * Math.cos(a);
          const y = cy + radius * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = width;
        ctx.stroke();
      }

      drawHex(65, "rgba(239, 68, 68, 0.2)", 1);
      drawHex(50, "rgba(239, 68, 68, 0.5)", 1.5);
      drawHex(35, "rgba(245, 158, 11, 0.6)", 1.5);

      // Radar sweep
      const r = 75;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, radarAngle, radarAngle + 0.45);
      ctx.closePath();
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, "rgba(239, 68, 68, 0.3)");
      grad.addColorStop(1, "rgba(239, 68, 68, 0)");
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // Radar line
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(radarAngle) * r, cy + Math.sin(radarAngle) * r);
      ctx.strokeStyle = "rgba(239, 68, 68, 0.8)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Intrusion packets
      for (const p of packets) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.blocked ? 3 : 2, 0, Math.PI * 2);
        ctx.fillStyle = p.blocked ? "#EF4444" : "#F59E0B";
        ctx.fill();
      }

      // Cryptographic hash watermark stream
      ctx.font = "10px monospace";
      ctx.fillStyle = "rgba(239, 68, 68, 0.15)";
      for (let i = 0; i < 6; i++) {
        ctx.fillText("HASH::" + hashes[i % hashes.length] + " [SECURED]", 20, 25 + i * 28);
      }
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
