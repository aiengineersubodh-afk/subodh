<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrical Engineering Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #76cc5e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      let phase = 0;

      function init(w, h) { }
      function onResize(w, h) { }

      function update(dt) {
        phase += dt * 3.0;
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);
        const midY = h * 0.48;

        // 3-Phase AC sinusoidal waveforms (V_A, V_B, V_C with 120deg offset)
        const phases = [
          { offset: 0, color: "#F59E0B", label: "Phase A" },
          { offset: (Math.PI * 2) / 3, color: "#FDE047", label: "Phase B" },
          { offset: (Math.PI * 4) / 3, color: "#EA580C", label: "Phase C" }
        ];

        for (const p of phases) {
          ctx.beginPath();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1.8;
          for (let x = 0; x < w; x += 4) {
            const y = midY + Math.sin(x * 0.02 + phase + p.offset) * (h * 0.22);
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        // Rotating magnetic field lines in center (stator / rotor simulation)
        const cx = w * 0.5;
        const cy = h * 0.48;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(phase * 0.25);
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 75, 28, (Math.PI / 4) * i, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(245, 158, 11, 0.15)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();

        // High voltage spark arc occasionally flashing
        if (Math.sin(phase * 2) > 0.85) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(253, 224, 71, 0.7)";
          ctx.lineWidth = 1.5;
          let arcX = w * 0.2;
          let arcY = h * 0.2;
          ctx.moveTo(arcX, arcY);
          for (let i = 0; i < 6; i++) {
            arcX += (w * 0.6) / 6;
            arcY += (Math.random() - 0.5) * 25;
            ctx.lineTo(arcX, arcY);
          }
          ctx.stroke();
        }
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
