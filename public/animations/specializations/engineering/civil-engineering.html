<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civil Engineering Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1424; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let loadT = 0;

    function init(w, h) {}
    function onResize(w, h) {}

    function update(dt) {
      loadT += dt * 0.8;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);

      // Blueprint drafting grid
      ctx.strokeStyle = "rgba(56, 189, 248, 0.05)";
      ctx.lineWidth = 1;
      const gSize = 25;
      for (let x = 0; x < w; x += gSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += gSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Pratt Truss Bridge Structural Framework
      const bays = 6;
      const bayW = (w * 0.8) / bays;
      const startX = w * 0.1;
      const botY = h * 0.65;
      const topY = h * 0.35;

      const topNodes = [];
      const botNodes = [];

      for (let i = 0; i <= bays; i++) {
        botNodes.push({ x: startX + i * bayW, y: botY });
        if (i > 0 && i < bays) {
          topNodes.push({ x: startX + i * bayW, y: topY });
        }
      }

      // Bottom chord
      ctx.beginPath();
      ctx.moveTo(botNodes[0].x, botNodes[0].y);
      for (let i = 1; i < botNodes.length; i++) ctx.lineTo(botNodes[i].x, botNodes[i].y);
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Top chord
      ctx.beginPath();
      ctx.moveTo(topNodes[0].x, topNodes[0].y);
      for (let i = 1; i < topNodes.length; i++) ctx.lineTo(topNodes[i].x, topNodes[i].y);
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Diagonal and vertical truss members with FEA stress colors
      for (let i = 0; i < topNodes.length; i++) {
        const tn = topNodes[i];
        const bn = botNodes[i + 1];

        // Vertical member
        ctx.beginPath();
        ctx.moveTo(tn.x, tn.y);
        ctx.lineTo(bn.x, bn.y);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Diagonal member (tension: blue, compression: orange)
        const isComp = (i + Math.floor(loadT)) % 2 === 0;
        ctx.beginPath();
        ctx.moveTo(topNodes[i].x, topNodes[i].y);
        ctx.lineTo(botNodes[i].x, botNodes[i].y);
        ctx.strokeStyle = isComp ? "#F59E0B" : "#38BDF8";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }

      // Moving live vehicle load vector
      const loadPos = (loadT % 1) * (w * 0.8) + startX;
      ctx.beginPath();
      ctx.moveTo(loadPos, botY - 25);
      ctx.lineTo(loadPos, botY - 5);
      ctx.strokeStyle = "#EF4444";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Load arrow tip
      ctx.beginPath();
      ctx.moveTo(loadPos - 4, botY - 12);
      ctx.lineTo(loadPos, botY - 5);
      ctx.lineTo(loadPos + 4, botY - 12);
      ctx.strokeStyle = "#EF4444";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
