<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Health Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #6a31a4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      const nodes = [];
      let spreadT = 0;

      function init(w, h) {
        nodes.length = 0;
        const count = 35;
        for (let i = 0; i < count; i++) {
          nodes.push({
            x: w * 0.15 + Math.random() * (w * 0.7),
            y: h * 0.2 + Math.random() * (h * 0.6),
            state: i === 0 ? 'infected' : (Math.random() < 0.4 ? 'immune' : 'susceptible')
          });
        }
      }

      function onResize(w, h) { init(w, h); }

      function update(dt) {
        spreadT += dt;
        if (spreadT > 2.0) {
          spreadT = 0;
          // Random infection spread
          const inf = nodes.filter(n => n.state === 'infected');
          if (inf.length < 15) {
            const target = nodes.find(n => n.state === 'susceptible');
            if (target) target.state = 'infected';
          } else {
            // Reset wave
            nodes.forEach((n, i) => n.state = i === 0 ? 'infected' : (Math.random() < 0.4 ? 'immune' : 'susceptible'));
          }
        }
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);

        // Contact transmission lines between nearby nodes
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            if (Math.hypot(dx, dy) < 70) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        // Epidemic Network Population Nodes
        for (const n of nodes) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
          if (n.state === 'infected') {
            ctx.fillStyle = "#EF4444";
            ctx.shadowColor = "#EF4444";
            ctx.shadowBlur = 8;
          } else if (n.state === 'immune') {
            ctx.fillStyle = "#10B981";
          } else {
            ctx.fillStyle = "#38BDF8";
          }
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
