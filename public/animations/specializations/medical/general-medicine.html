<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Medicine Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d0c74b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      let sweepX = 0;
      const ecgBuffer = [];

      function init(w, h) {
        ecgBuffer.length = 0;
        for (let x = 0; x < w; x++) {
          ecgBuffer.push(h * 0.5);
        }
      }

      function onResize(w, h) { init(w, h); }

      function getEcgY(t, midY) {
        const cycle = t % 120;
        if (cycle < 20) return midY;
        if (cycle < 30) return midY - 6; // P wave
        if (cycle < 45) return midY;
        if (cycle < 50) return midY + 8; // Q dip
        if (cycle < 58) return midY - 60; // R peak
        if (cycle < 65) return midY + 18; // S dip
        if (cycle < 80) return midY;
        if (cycle < 95) return midY - 14; // T wave
        return midY;
      }

      function update(dt) {
        const step = Math.floor(dt * 180);
        const midY = h * 0.5;
        for (let s = 0; s < step; s++) {
          sweepX = (sweepX + 1) % w;
          ecgBuffer[sweepX] = getEcgY(sweepX + (Date.now() * 0.05), midY);
        }
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);

        // Hospital Monitor Grid
        ctx.strokeStyle = "rgba(16, 185, 129, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 25) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += 25) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // ECG Waveform trace
        ctx.beginPath();
        ctx.strokeStyle = "#10B981";
        ctx.lineWidth = 2.0;
        ctx.shadowColor = "#10B981";
        ctx.shadowBlur = 8;

        let started = false;
        for (let x = 0; x < w; x++) {
          // Gap near the sweep head
          if (Math.abs(x - sweepX) < 15) continue;
          const y = ecgBuffer[x];
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Pulse readout text
        ctx.font = "bold 13px monospace";
        ctx.fillStyle = "#EF4444";
        ctx.fillText(" ", 20, 30);
        ctx.fillStyle = "#10B981";
        ctx.fillText(" ", 20, 50);
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
