<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surgery Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d77a28;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });


      let targetX = 0;
      let targetY = 0;
      let t = 0;

      function init(w, h) {
        targetX = w * 0.5;
        targetY = h * 0.5;
      }

      function onResize(w, h) { init(w, h); }

      function update(dt) {
        t += dt * 1.5;
        targetX = w * 0.5 + Math.sin(t * 0.7) * (w * 0.25);
        targetY = h * 0.5 + Math.cos(t * 0.9) * (h * 0.2);
      }

      function draw(ctx, w, h) {
        ctx.clearRect(0, 0, w, h);

        // Laparoscopic circular field of view
        const cx = w * 0.5;
        const cy = h * 0.5;
        const fovR = Math.min(w, h) * 0.42;

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, fovR, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.clip();

        // Tissue contour lines
        ctx.strokeStyle = "rgba(239, 68, 68, 0.12)";
        ctx.lineWidth = 1.2;
        for (let r = 20; r < fovR; r += 35) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Laser scalpel guidance crosshairs
        ctx.beginPath();
        ctx.moveTo(targetX - 25, targetY); ctx.lineTo(targetX + 25, targetY);
        ctx.moveTo(targetX, targetY - 25); ctx.lineTo(targetX, targetY + 25);
        ctx.strokeStyle = "#22C55E";
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Precision target reticle circle
        ctx.beginPath();
        ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
        ctx.strokeStyle = "#22C55E";
        ctx.lineWidth = 1.5;
        ctx.shadowColor = "#22C55E";
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Micro-suture curved arc paths
        ctx.beginPath();
        ctx.arc(targetX - 35, targetY - 15, 20, 0.2, Math.PI * 0.9);
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.restore();
      }


      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>

</html>
