<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Biotechnology Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #11081C; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let t = 0;

    function init(w, h) {}
    function onResize(w, h) {}

    function update(dt) {
      t += dt * 1.5;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5;
      const cy = h * 0.48;

      // CRISPR-Cas9 Endonuclease Molecular Scissor Mechanism
      // Target DNA unwinding
      ctx.beginPath();
      ctx.strokeStyle = "#06B6D4";
      ctx.lineWidth = 2.5;
      for (let x = w * 0.15; x < w * 0.85; x += 5) {
        // Strand 1
        const bulge = Math.exp(-Math.pow(x - cx, 2) / 3000) * 22;
        const y1 = cy - 14 - bulge + Math.sin(x * 0.05 + t) * 4;
        if (x === w * 0.15) ctx.moveTo(x, y1); else ctx.lineTo(x, y1);
      }
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = "#06B6D4";
      ctx.lineWidth = 2.5;
      for (let x = w * 0.15; x < w * 0.85; x += 5) {
        // Strand 2
        const bulge = Math.exp(-Math.pow(x - cx, 2) / 3000) * 22;
        const y2 = cy + 14 + bulge - Math.sin(x * 0.05 + t) * 4;
        if (x === w * 0.15) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
      }
      ctx.stroke();

      // Guide RNA (sgRNA) in magenta
      ctx.beginPath();
      ctx.strokeStyle = "#EC4899";
      ctx.lineWidth = 2;
      for (let x = cx - 40; x < cx + 40; x += 4) {
        const y = cy - 6 + Math.sin(x * 0.1) * 3;
        if (x === cx - 40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Cas9 Endonuclease Cleavage Spark Flash
      if (Math.sin(t * 3) > 0.6) {
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#FDE047";
        ctx.shadowColor = "#FDE047";
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
