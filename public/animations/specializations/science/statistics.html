<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07111F; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      let isPaused = false;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        if (typeof onResize === 'function') onResize(w, h);
      }
      window.addEventListener('resize', resize);

      window.addEventListener('message', (e) => {
        if (e.data === 'pause') isPaused = true;
        if (e.data === 'play') {
          if (isPaused) {
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(renderLoop);
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        isPaused = document.hidden;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(renderLoop);
        }
      });

      
    let shift = 0;

    function init(w, h) {}
    function onResize(w, h) {}

    function update(dt) {
      shift += dt * 0.8;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5 + Math.sin(shift) * 25;
      const baseY = h * 0.82;
      const sigma = 55;

      // Gaussian Normal Bell Curve Shaded Region (-1 sigma to +1 sigma)
      ctx.beginPath();
      ctx.moveTo(cx - sigma, baseY);
      for (let x = cx - sigma; x <= cx + sigma; x += 2) {
        const z = (x - cx) / sigma;
        const y = baseY - (Math.exp(-0.5 * z * z) * (h * 0.55));
        ctx.lineTo(x, y);
      }
      ctx.lineTo(cx + sigma, baseY);
      ctx.closePath();
      ctx.fillStyle = "rgba(59, 130, 246, 0.2)";
      ctx.fill();

      // Full Normal Curve Outline
      ctx.beginPath();
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 2.2;
      for (let x = 0; x < w; x += 3) {
        const z = (x - cx) / sigma;
        const y = baseY - (Math.exp(-0.5 * z * z) * (h * 0.55));
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Standard deviation marker lines
      ctx.strokeStyle = "rgba(245, 158, 11, 0.6)";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);

      // Mean mu
      ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - (h * 0.55)); ctx.stroke();
      // -1 sigma
      ctx.beginPath(); ctx.moveTo(cx - sigma, baseY); ctx.lineTo(cx - sigma, baseY - (h * 0.33)); ctx.stroke();
      // +1 sigma
      ctx.beginPath(); ctx.moveTo(cx + sigma, baseY); ctx.lineTo(cx + sigma, baseY - (h * 0.33)); ctx.stroke();
      ctx.setLineDash([]);
    }
    

      let lastTime = performance.now();
      function renderLoop(now) {
        if (isPaused) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof draw === 'function') draw(ctx, w, h);
        if (!prefersReducedMotion) {
          requestAnimationFrame(renderLoop);
        }
      }

      if (typeof init === 'function') init(w, h);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
