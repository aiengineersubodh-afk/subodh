<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Systems and Sustainability Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #29AEA5
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      let w, h, dpr, time = 0, last = performance.now(), paused = false;
      let particles = [], stars = [], leaves = [];
      const TAU = Math.PI * 2;
      const C = {
        bg: "#29AEA5",
        ocean: "#123B59",
        deep: "#0D3045",
        blue: "#2B83A0",
        ice: "#E5FAFF",
        white: "#F5FFFF",
        green: "#75D9A7",
        lime: "#B6E6A0",
        gold: "#FFD078",
        coral: "#FF987A"
      };
      const rand = (a, b) => Math.random() * (b - a) + a;
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        particles = Array.from({ length: Math.min(120, Math.floor(w * h / 8000)) }, () => ({
          x: rand(0, w), y: rand(0, h), r: rand(1, 2.7),
          speed: rand(7, 23), phase: rand(0, TAU),
          color: Math.random() > .5 ? C.ice : C.gold
        }));
        stars = Array.from({ length: 50 }, () => ({
          x: rand(0, w), y: rand(0, h), r: rand(.5, 1.5), phase: rand(0, TAU)
        }));
        leaves = Array.from({ length: 10 }, (_, i) => ({
          a: i * TAU / 10, orbit: rand(170, 230), size: rand(7, 12),
          speed: rand(.08, .16), phase: rand(0, TAU)
        }));
      }
      function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur }
      function noGlow() { ctx.shadowBlur = 0 }
      function line(x1, y1, x2, y2, color, width = 1) {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      }
      function background() {
        ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, h);
        const g = ctx.createRadialGradient(w * .5, h * .48, 20, w * .5, h * .5, Math.max(w, h) * .8);
        g.addColorStop(0, "rgba(220,255,245,.12)");
        g.addColorStop(.55, "rgba(8,65,75,.06)");
        g.addColorStop(1, "rgba(4,40,55,.27)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

        // Fine scientific grid
        ctx.strokeStyle = "rgba(229,250,255,.065)";
        ctx.lineWidth = .7;
        for (let x = 0; x < w; x += 48)line(x, 0, x, h, "rgba(229,250,255,.05)");
        for (let y = 0; y < h; y += 48)line(0, y, w, y, "rgba(229,250,255,.05)");

        for (const s of stars) {
          ctx.globalAlpha = .13 + .22 * (.5 + .5 * Math.sin(time + s.phase));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fillStyle = C.white; ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      function orbit(cx, cy, r) {
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * (1.35 + i * .17), r * (.78 + i * .14), -.18, 0, TAU);
          ctx.strokeStyle = `rgba(229,250,255,${.22 - i * .03})`;
          ctx.lineWidth = 1;
          ctx.setLineDash(i % 2 ? [5, 9] : []);
          ctx.lineDashOffset = -time * (8 + i * 2);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      function drawEarth(cx, cy, r) {
        const halo = ctx.createRadialGradient(cx, cy, r * .7, cx, cy, r * 1.85);
        halo.addColorStop(0, "rgba(229,250,255,.28)");
        halo.addColorStop(.55, "rgba(117,217,167,.13)");
        halo.addColorStop(1, "rgba(117,217,167,0)");
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(cx, cy, r * 1.85, 0, TAU); ctx.fill();

        const earth = ctx.createRadialGradient(cx - r * .4, cy - r * .45, r * .04, cx, cy, r);
        earth.addColorStop(0, "#56AFC0");
        earth.addColorStop(.55, "#216B81");
        earth.addColorStop(1, "#103B56");
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = earth; ctx.fill();

        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();

        // Ocean currents
        for (let i = 0; i < 7; i++) {
          const y = cy - r * .65 + i * r * .22;
          ctx.beginPath();
          ctx.ellipse(cx + Math.sin(time * .4 + i) * 7, y, r * .95, r * .085,
            Math.sin(time * .2) * .1, 0, TAU);
          ctx.strokeStyle = "rgba(120,225,226,.24)";
          ctx.lineWidth = 1.1; ctx.stroke();
        }

        // Continents
        ctx.fillStyle = C.green;
        ctx.globalAlpha = .9;
        ctx.beginPath();
        ctx.moveTo(cx - r * .75, cy - r * .35);
        ctx.quadraticCurveTo(cx - r * .52, cy - r * .88, cx - r * .12, cy - r * .58);
        ctx.lineTo(cx + r * .06, cy - r * .3);
        ctx.lineTo(cx - r * .12, cy - r * .02);
        ctx.lineTo(cx - r * .43, cy + r * .08);
        ctx.lineTo(cx - r * .57, cy + r * .48);
        ctx.lineTo(cx - r * .78, cy + r * .19);
        ctx.closePath(); ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx + r * .12, cy - r * .67);
        ctx.lineTo(cx + r * .48, cy - r * .55);
        ctx.lineTo(cx + r * .75, cy - r * .2);
        ctx.lineTo(cx + r * .51, cy + r * .05);
        ctx.lineTo(cx + r * .6, cy + r * .37);
        ctx.lineTo(cx + r * .28, cy + r * .7);
        ctx.lineTo(cx + r * .05, cy + r * .34);
        ctx.lineTo(cx - r * .02, cy - r * .1);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;

        // Polar ice caps
        ctx.beginPath();
        ctx.ellipse(cx - r * .05, cy - r * .82, r * .55, r * .13, 0, 0, TAU);
        ctx.fillStyle = C.ice; ctx.globalAlpha = .88; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + r * .02, cy + r * .82, r * .4, r * .1, 0, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Atmospheric latitude and longitude
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * (.95 - Math.abs(i) * .1),
            r * (.22 + Math.abs(i) * .13), time * .08, 0, TAU);
          ctx.strokeStyle = "rgba(229,250,255,.25)";
          ctx.lineWidth = .9; ctx.stroke();
        }
        ctx.restore();

        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
        ctx.strokeStyle = C.ice; ctx.lineWidth = 2;
        glow(C.ice, 17); ctx.stroke(); noGlow();
      }
      function atmosphere(cx, cy, r) {
        for (let i = 0; i < 4; i++) {
          const p = Math.sin(time * .8 + i * .8) * 3;
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * (1.23 + i * .13) + p,
            r * (1.23 + i * .13) + p, 0, 0, TAU);
          ctx.strokeStyle = i % 2 ?
            `rgba(255,152,122,${.25 - i * .035})` :
            `rgba(229,250,255,${.23 - i * .03})`;
          ctx.lineWidth = i === 0 ? 2 : 1;
          ctx.setLineDash(i === 1 ? [5, 8] : []);
          ctx.lineDashOffset = -time * 12;
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      function solarRays(cx, cy, r) {
        const sx = cx - r * 2.5, sy = cy - r * 1.25;
        const sun = ctx.createRadialGradient(sx, sy, 2, sx, sy, r * .45);
        sun.addColorStop(0, C.white);
        sun.addColorStop(.25, C.gold);
        sun.addColorStop(1, "rgba(255,208,120,0)");
        ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(sx, sy, r * .45, 0, TAU); ctx.fill();

        for (let i = 0; i < 7; i++) {
          const a = (i - 3) * .13;
          ctx.beginPath();
          ctx.moveTo(sx + r * .2, sy);
          ctx.lineTo(cx - r * .65, cy + r * a);
          ctx.strokeStyle = `rgba(255,208,120,${.24 + Math.sin(time + i) * .08})`;
          ctx.lineWidth = 1.2; ctx.stroke();
          const p = (time * .18 + i * .15) % 1;
          const x = sx + (cx - r * .65 - sx) * p;
          const y = sy + (cy + r * a - sy) * p;
          ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU);
          ctx.fillStyle = C.gold; glow(C.gold, 9); ctx.fill(); noGlow();
        }
      }
      function drawLeaf(x, y, s, a, color) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.bezierCurveTo(s * .8, -s * .9, s * 1.8, -s * .9, s * 2, 0);
        ctx.bezierCurveTo(s * 1.3, s * .9, s * .6, s * .8, 0, 0);
        ctx.fillStyle = color; glow(color, 10); ctx.fill(); noGlow();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s, 0, s * 2, 0);
        ctx.strokeStyle = "rgba(13,48,69,.65)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
      }
      function orbitLeaves(cx, cy) {
        for (const l of leaves) {
          const a = l.a + time * l.speed;
          const x = cx + Math.cos(a) * l.orbit;
          const y = cy + Math.sin(a) * l.orbit * .55;
          drawLeaf(x, y, l.size, a + Math.PI / 2, l.phase > 3 ? C.lime : C.green);
        }
      }
      function circulation(cx, cy, r) {
        for (let i = 0; i < 5; i++) {
          const p = (time * .14 + i / 5) % 1;
          const a = p * TAU;
          const x = cx + Math.cos(a) * r * 1.45;
          const y = cy + Math.sin(a) * r * .72;
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * 1.45, r * .72, time * .12, 0, TAU);
          ctx.strokeStyle = "rgba(117,217,167,.17)";
          ctx.lineWidth = 1; ctx.stroke();
          ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU);
          ctx.fillStyle = i % 2 ? C.green : C.ice;
          glow(C.green, 11); ctx.fill(); noGlow();
        }
      }
      function carbonParticles(cx, cy, r) {
        for (let i = 0; i < 12; i++) {
          const a = i * TAU / 12 + time * .09;
          const x = cx + Math.cos(a) * r * 1.65;
          const y = cy + Math.sin(a) * r * 1.4;
          ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU);
          ctx.fillStyle = C.coral; glow(C.coral, 9); ctx.fill(); noGlow();
        }
      }
      function leafNetwork(cx, cy, r) {
        const pts = [];
        for (let i = 0; i < 8; i++) {
          const a = i * TAU / 8 + time * .06;
          pts.push({ x: cx + Math.cos(a) * r * 2.05, y: cy + Math.sin(a) * r * 1.45 });
        }
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          ctx.beginPath(); ctx.moveTo(a.x, a.y);
          ctx.quadraticCurveTo(cx, cy, b.x, b.y);
          ctx.strokeStyle = "rgba(229,250,255,.2)";
          ctx.lineWidth = 1; ctx.stroke();
          const p = (time * .17 + i * .13) % 1;
          const x = a.x + (b.x - a.x) * p, y = a.y + (b.y - a.y) * p;
          ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU);
          ctx.fillStyle = C.gold; glow(C.gold, 10); ctx.fill(); noGlow();
        }
      }
      function particlesDraw(dt) {
        for (const p of particles) {
          p.y -= p.speed * dt;
          p.x += Math.sin(time + p.phase) * 7 * dt;
          if (p.y < -10) { p.y = h + 10; p.x = rand(0, w) }
          ctx.globalAlpha = .22 + .45 * (.5 + .5 * Math.sin(time * 1.4 + p.phase));
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fillStyle = p.color; glow(p.color, 9); ctx.fill(); noGlow();
          ctx.globalAlpha = 1;
        }
      }
      function draw(dt) {
        background();
        const cx = w * .5, cy = h * .49;
        const scale = Math.min(w / 1050, h / 760, 1.1);
        const r = Math.min(70 * scale, 85);
        orbit(cx, cy, r);
        solarRays(cx, cy, r);
        leafNetwork(cx, cy, r);
        circulation(cx, cy, r);
        atmosphere(cx, cy, r);
        orbitLeaves(cx, cy);
        carbonParticles(cx, cy, r);
        drawEarth(cx, cy, r);
        particlesDraw(dt);
      }
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function render(now) {
        if (paused) return;
        const dt = Math.min((now - last) / 1000, .05);
        last = now; time += dt; draw(dt);
        if (!reduced) requestAnimationFrame(render);
      }
      function start() { if (paused) return; last = performance.now(); requestAnimationFrame(render) }
      addEventListener("resize", resize);
      addEventListener("message", e => {
        if (e.data === "pause") paused = true;
        if (e.data === "play" && paused) { paused = false; start() }
      });
      document.addEventListener("visibilitychange", () => {
        paused = document.hidden; if (!paused) start();
      });
      resize(); start();
    })();
  </script>
</body>

</html>
